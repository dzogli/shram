name: Сборка игры

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  pages:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Подготовка сайта
        run: |
          mkdir site
          cp index.html manifest.webmanifest sw.js site/
          cp -r icons site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Capacitor + Android-проект
        run: |
          npm install --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir -p www
          cp index.html manifest.webmanifest www/
          cp -r icons www/
          npx cap add android
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp icons/icon-192.png android/app/src/main/res/mipmap-$d/ic_launcher.png
            cp icons/icon-192.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png
            rm -f android/app/src/main/res/mipmap-$d/ic_launcher_foreground.png
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          npx cap sync android
      - name: Сборка APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Shram.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Shram-Android-APK
          path: Shram.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Сборка .exe
        run: |
          npm install --no-save electron@31 electron-builder@24
          npx electron-builder --win portable --publish never
          Copy-Item dist\*.exe Shram-Windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Shram-Windows
          path: Shram-Windows.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ android, windows ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/Shram-Android-APK/Shram.apk
            out/Shram-Windows/Shram-Windows.exe
